aid: 4gclinical
name: 4G Clinical
description: '4G Clinical is a clinical-trial technology company headquartered in Wellesley,
  Massachusetts, building randomization and trial supply management (RTSM) software for
  biotech, pharmaceutical and CRO sponsors. Its flagship platform, Prancer RTSM, uses natural
  language processing to read a written RTSM specification and generate a deployable
  randomization and supply system, and is sold alongside Prancer Lite for early-phase studies,
  the Prancer RTSM Inventory Platform for investigator-sponsored trials, 4C Supply for clinical
  supply forecasting and scenario planning, and 4G DataHub for portfolio-level study data
  delivery. The company operates a production API host at api.4gclinical.com and markets
  API-enabled data access, Enterprise Prancer Integrations and EDC/CTMS/depot connectivity, but
  publishes no public developer portal, API reference or machine-readable contract: integration
  scope is settled inside a sponsor engagement rather than on the public web.'
