apis:
- name: 4G Clinical API
  description: 'Production API host operated by 4G Clinical on AWS API Gateway at
    api.4gclinical.com. Anonymous requests to every probed path return HTTP 403
    ForbiddenException, so no route, contract or discovery document is reachable without
    sponsor credentials. 4G Clinical describes the surface in marketing terms as "API-enabled
    access for sponsor systems, dashboards, and reporting environments" (4G DataHub) plus
    Enterprise Prancer Integrations, and its own vulnerability disclosure policy puts
    "public-facing systems and APIs" in scope. No OpenAPI, GraphQL, AsyncAPI, WSDL or MCP
    manifest is published; see x-coverage.'
